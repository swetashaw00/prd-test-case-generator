spring.application.name=PrdTestCaseGenerator

server.port=8080
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Gemini model + output budget. Override via env vars or -D system properties.
# Requires a free API key from https://aistudio.google.com/apikey set as the
# GEMINI_API_KEY environment variable (never hardcode it here).
# gemini-flash-latest / gemini-3.5-flash are the "correct" default but were
# persistently 503 (Google-side overload) as of 2026-07-16 for this key.
# gemini-3-flash-preview is confirmed working for this key right now, so it's
# the current default. It's a preview model (free, tighter limits, subject to
# change) — switch back to gemini-flash-latest once the overload clears.
# Older pinned versions (gemini-2.0-flash, gemini-2.5-flash, gemini-2.5-flash-lite)
# may return 404 "no longer available to new users" or a hard-zero free-tier
# quota depending on when your API key was created — check
# https://aistudio.google.com/rate-limit for what your specific key can use.
gemini.model=gemini-3-flash-preview
gemini.max-tokens=8192

# H2 file-based database — stores generation history (past PRD/screenshot
# analyses). The file lives under ./data, gitignored, and persists across
# restarts. Browse it at http://localhost:8080/h2-console (JDBC URL below,
# user "sa", blank password) while the app is running.
spring.datasource.url=jdbc:h2:file:./data/prdtestgen;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
